name: Build Ishaan AI APK

on:
  push:
    branches: [ main, "ishaan-*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, database and UI tests (JVM / Robolectric)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify the APK has no network permission (offline guarantee)
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APK=app/build/outputs/apk/release/app-release.apk
          $AAPT2 dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission found in APK. The app must stay offline."; exit 1
          fi
          echo "OK: no INTERNET permission. The app cannot reach the network."

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/IshaanAI-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/IshaanAI-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IshaanAI-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || 'ishaan-latest' }}
          name: Ishaan AI (latest build)
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            Install **IshaanAI-release.apk**. Every build is signed with the same key, so it updates in place without losing records.
          prerelease: false
          make_latest: ${{ github.ref_name == 'main' }}
          files: out/*.apk
